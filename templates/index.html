<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokenizer Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
            <div class="header">
                <h1>LLM Tokenizer Visualizer</h1>
                <p class="tagline">Break text into AI-readable tokens</p>
            </div>
            <div class="prompt-cont">
                <textarea id="prompt" placeholder="Type something..."></textarea>
            </div>
            <div class="stats">
                <p>Characters: <span id="charCount">0</span></p>
                <p>Tokens: <span id="tokenCount">0</span></p>
            </div>
    <div class="output">
            <div class="token-container" id="tokenContainer">
            </div>
    </div>
    <script src="../static/src.js"></script>
</body>
</html>
